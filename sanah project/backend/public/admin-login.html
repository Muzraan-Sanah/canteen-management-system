<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Login</title>
  <link rel="icon" type="image/png" sizes="194x194" href="https://i.postimg.cc/qBLNYw1g/icon-up.png">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(-45deg, #141E30, #243B55, #0f2027, #2c5364);
      background-size: 400% 400%;
      animation: gradientMove 12s ease infinite;
      position: relative;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: twinkle 5s infinite linear;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    .stars-container {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .login-box {
      z-index: 1;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      width: 300px;
      text-align: center;
      color: #fff;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      box-sizing: border-box;
    }

    input {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    input::placeholder {
      color: #ddd;
    }

    button {
      background-color: #1abc9c;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #16a085;
    }

    #error {
      color: #ff6b6b;
      margin-top: 10px;
    }

    #spinner {
      margin-top: 10px;
      display: none;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid #1abc9c;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
      margin: 10px auto 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .password-container {
      position: relative;
      width: 100%;
    }

    .password-container input {
      padding-right: 40px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      cursor: pointer;
    }

    .toggle-password img {
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>
  <!-- 🌟 Floating Stars -->
  <div class="stars-container" id="stars"></div>

  <!-- 🔐 Login Box -->
  <div class="login-box">
    <h2>Admin Login</h2>
    <form id="adminForm">
      <input type="text" id="username" placeholder="Username" required />

      <div class="password-container">
        <input type="password" id="password" placeholder="Password" required />
        <span class="toggle-password" onclick="togglePassword()">
          <img src="https://img.icons8.com/ios-filled/20/ffffff/visible.png" alt="Show" id="eyeIcon" />
        </span>
      </div>

      <button type="submit">Login</button>
    </form>
    <div id="spinner"><div class="spinner"></div></div>
    <p id="error"></p>
  </div>

  <script>
    // Login functionality
    document.getElementById("adminForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      document.getElementById("spinner").style.display = "block";
      document.getElementById("error").innerText = "";

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (data.success) {
          sessionStorage.setItem("adminToken", data.token);
          window.location.href = "/admin.html";
        } else {
          document.getElementById("error").innerText = "Invalid credentials!";
        }
      } catch (err) {
        document.getElementById("error").innerText = "Login failed!";
      }

      document.getElementById("spinner").style.display = "none";
    });

    // Toggle password visibility
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eyeIcon");

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        eyeIcon.src = "https://img.icons8.com/ios-filled/20/ffffff/invisible.png";
      } else {
        passwordInput.type = "password";
        eyeIcon.src = "https://img.icons8.com/ios-filled/20/ffffff/visible.png";
      }
    }

    // Generate floating stars
    const starCount = 100;
    const starsContainer = document.getElementById("stars");

    for (let i = 0; i < starCount; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.left = `${Math.random() * 100}%`;
      star.style.top = `${Math.random() * 100}%`;
      star.style.animationDuration = `${Math.random() * 5 + 3}s`;
      star.style.opacity = `${Math.random()}`;
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
