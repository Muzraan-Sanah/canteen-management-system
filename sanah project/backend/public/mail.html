<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Us - KITS Cantoche</title>
    <link rel="icon" type="image/png" sizes="194x194" href="https://i.postimg.cc/qBLNYw1g/icon-up.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            flex-direction: column;
        }
        .container {
            width: 40%;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 2px 2px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
        h1 {
            color: #333;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }
        label {
            font-size: 1.1em;
            color: #555;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }
        .button {
            width: 100%;
            padding: 8px;
            background:  #6A5ACD;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s;
        }
        .button:hover {
            background: #4B4F70;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 768px) {
            .container {
                width: 70%;
            }
        }
    </style>
    <script>
        function showAlert(event) {
            event.preventDefault();
            alert("Your message has been sent successfully! We will get back to you soon.");
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Email Us</h1>
        <form onsubmit="showAlert(event)" action="http://localhost:3000/email" method="POST">
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="email">Your Email:</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" placeholder="Enter subject" required>
            </div>
            <div class="form-group">
                <label for="message">Your Message:</label>
                <textarea id="message" rows="5" placeholder="Type your message here..." required></textarea>
            </div>
            <button class="button" type="submit">Send Message</button>
        </form>
    </div>
</body>
</html>
